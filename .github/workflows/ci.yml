name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Syntax check
        run: |
          python -m py_compile slice.py batch.py proof_slicer/*.py tests/*.py
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v

  integration:
    name: Integration tests (Rocq 9.3, rocq compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: rocq/rocq-prover:9.3
          uninstall: ''
          custom_script: |
            startGroup "Install Python"
              sudo apt-get update -y -q
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends python3
            endGroup
            startGroup "Run integration tests in a writable copy"
              # The container user and the GitHub workdir have different UIDs.
              # Rocq writes .glob/.vo files next to the sources, so compile a
              # copy owned by the container user instead of the bind mount.
              WORK=$(mktemp -d)
              cp -R . "$WORK/repo"
              cd "$WORK/repo"
              python3 selftest.py
            endGroup
